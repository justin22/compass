<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tabs</title>
<style>
  :root { --bg: #ececef; --fg: #1c1c1e; --muted: #6e6e73; --hover: rgb(0 0 0 / .05); --active: #fff; --tile: rgb(0 0 0 / .05); --tile-hover: rgb(0 0 0 / .09); --shadow: 0 1px 2px rgb(0 0 0 / .1); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e20; --fg: #f2f2f7; --muted: #98989d; --hover: rgb(255 255 255 / .05); --active: rgb(255 255 255 / .1); --tile: rgb(255 255 255 / .06); --tile-hover: rgb(255 255 255 / .11); --shadow: none; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 8px; background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; user-select: none; }
  .embed body { background: transparent; } /* the overlay's glass panel shows through */
  img { width: 16px; height: 16px; flex: none; }

  #address { display: flex; align-items: center; gap: 7px; height: 34px; margin-bottom: 10px; padding: 0 5px 0 10px; border-radius: 10px; background: var(--tile); }
  #address:focus-within { background: var(--active); box-shadow: var(--shadow); }
  #address svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #insecure { color: var(--muted); }
  #url { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: none; color: var(--fg); font: inherit; font-weight: 500; user-select: text; }
  #url::placeholder { color: var(--muted); font-weight: 400; }
  #copy { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--muted); display: grid; place-items: center; }
  #copy:hover { background: var(--hover); color: var(--fg); }
  #copy .ok, #copy.done .link { display: none; }
  #copy.done .ok { display: block; }
  #favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 10px; }
  .tile { position: relative; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--tile); color: var(--muted); font-size: 16px; }
  .tile.add { background: none; border: 1px dashed rgb(128 128 128 / .3); }
  .tile .x { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 12px; line-height: 1; box-shadow: 0 1px 2px rgb(0 0 0 / .2); }
  .tile .x:hover { color: var(--fg); }
  .list .pin { display: grid; color: var(--muted); }
  .list .pin svg { width: 12px; height: 12px; fill: currentColor; }

  .top { display: flex; justify-content: space-between; align-items: center; margin: -4px 0 6px; }
  #clock { padding-left: 4px; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  #dock { width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; }
  #dock:hover { background: var(--hover); color: var(--fg); }
  #dock svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  html:not(.embed) #dock svg { fill: currentColor; } /* filled pin = docked */
  .new { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; text-align: left; }
  .new:hover { background: var(--hover); }
  .new svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rename { padding: 2px 4px; margin-left: -4px; border: 0; outline: 0; border-radius: 4px; background: var(--tile); color: var(--fg); font: inherit; user-select: text; }
  .new span { width: 16px; text-align: center; font-size: 16px; line-height: 1; }

  ul { list-style: none; margin: 0; padding: 0; }
  .list li { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 10px; border-radius: 8px; }
  .list li.cursor, #pinned li:not(.active):hover { background: var(--hover); } /* mouse and ↑↓ share one highlight */
  .list li.active { background: var(--active); box-shadow: var(--shadow); }
  #pinbox { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgb(128 128 128 / .2); } /* Pinned and its folders, above the open tabs */
  #pinned li.closed { color: var(--muted); } /* saved, but no tab open */
  #pinned .folder svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #pinned .drop, #pinned.drop { box-shadow: inset 0 0 0 1.5px rgb(128 128 128 / .45); } /* where a dragged tab will land */
  #pinned.drop { border-radius: 8px; }
  #pinned li.drop { background: var(--tile-hover); }
  .list li.dragging.into { scale: .94; opacity: .85; } /* shrinks a little over a folder: going in */
  .list .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list li.marquee .t { text-overflow: clip; }
  .list li.marquee .t > span { display: inline-block; transition: translate linear .2s; } /* distance + duration set on the span by sidebar.js */
  @media (prefers-reduced-motion: reduce) { .list li.marquee .t { text-overflow: ellipsis; } .list li.marquee .t > span { display: inline; } }
  .list .x { width: 22px; height: 22px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 15px; line-height: 1; }
  @media (hover: hover) and (pointer: fine) { /* hover-revealed only where hover exists */
    .tile .x { opacity: 0; transition: opacity .12s ease; }
    .tile:hover .x { opacity: 1; }
    .list .x { visibility: hidden; }
    .list li:hover .x { visibility: visible; }
  }
  .list .pin-btn { display: grid; place-items: center; }
  .list .pin-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .list .pin-btn.on svg { fill: currentColor; }
  .list .x.confirm, .list .x.confirm:hover { width: auto; padding: 0 6px; visibility: visible; color: #ff3b30; font-size: 12px; font-weight: 500; }
  .list .x:hover { background: var(--hover); color: var(--fg); }

  /* crisp hover: lights up instantly, fades out slowly; press shrinks a touch */
  .list li, .tile, .new, #dock { transition: background-color .18s ease-out, scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.cursor, #pinned li:not(.active):hover, .tile:hover, .new:hover, #dock:hover { transition: background-color 0s, scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  .tile:not(.add):hover { background: var(--tile-hover); }
  .new:active, #dock:active { scale: .98; }

  /* reorder: neighbours slide aside to preview the drop; the dragged row follows the pointer 1:1 */
  .list.reordering li { transition: translate 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.dragging { z-index: 1; background: var(--active); box-shadow: 0 6px 18px rgb(0 0 0 / .14), 0 1px 2px rgb(0 0 0 / .08); scale: 1.02; cursor: grabbing;
                      transition: scale 150ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 150ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.settling { z-index: 1; transition: translate 150ms cubic-bezier(0.23, 1, 0.32, 1), scale 150ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 150ms cubic-bezier(0.23, 1, 0.32, 1); }
  .tile:active { scale: .96; }
  @media (prefers-reduced-motion: reduce) { /* keep the color fade, drop the press scale */
    .list li, .tile, .new, #dock { transition: background-color .18s ease-out; }
    .tile:active, .new:active, #dock:active { scale: 1; }
    .list.reordering li, .list li.settling { transition: none; } /* rows jump to their slots instead of sliding */
    .list li.dragging { scale: 1; transition: none; }
  }
</style>
</head>
<body>
<div class="top">
  <span id="clock"></span>
  <button id="dock"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
</div>
<div id="address">
  <svg id="insecure" viewBox="0 0 24 24"><title>Not secure: plain http</title><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  <input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
  <button id="copy" title="Copy URL">
    <svg class="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    <svg class="ok" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
  </button>
</div>
<div id="favs"></div>
<div id="pinbox">
  <ul id="pinned" class="list"></ul>
  <button id="newfolder" class="new"><svg viewBox="0 0 24 24"><path d="M12 10v6m-3-3h6M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>New Folder</button>
</div>
<button id="new" class="new"><span>+</span>New Tab</button>
<ul id="tabs" class="list"></ul>
<script type="module" src="sidebar.js"></script>
</body>
</html>
