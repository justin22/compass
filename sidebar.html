<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="favs.css">
<style>
  :root { color-scheme: light dark; /* same as the overlay's iframe: a mismatch makes Chrome paint the frame opaque white */ --bg: #ececef; --fg: #1c1c1e; --muted: #626267; /* 5.1:1 on --bg, 4.6 on --tile: 12px text needs 4.5 */ --hover: rgb(0 0 0 / .05); --active: #fff; --tile: rgb(0 0 0 / .05); --tile-hover: rgb(0 0 0 / .09); --shadow: 0 1px 2px rgb(0 0 0 / .1); --danger: #c90014; /* 4.6:1 on a hovered row; the brighter iOS red is 3:1 */ --glass: rgb(255 255 255 / .9); /* muted text keeps 4.5:1 even over a black page */ }
  :root[data-theme="dark"] { --bg: #1e1e20; --fg: #f2f2f7; --muted: #98989d; --hover: rgb(255 255 255 / .05); --active: rgb(255 255 255 / .1); --tile: rgb(255 255 255 / .06); --tile-hover: rgb(255 255 255 / .11); --shadow: none; --danger: #ff6961; /* the iOS red is 4:1 on the floating glass */ --glass: rgb(28 28 30 / .92); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 8px 48px; /* bottom: room so the last tab isn't hidden under the footer */ background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; user-select: none; }
  .embed { background: var(--glass); } /* glass tint lives in the frame, not the overlay: frame and page can disagree on dark mode, and the tint must match the text */
  .embed body { background: transparent; }
  img { width: 16px; height: 16px; flex: none; }

  #address { display: flex; align-items: center; gap: 7px; height: 34px; margin-bottom: 10px; padding: 0 5px 0 10px; border-radius: 10px; background: var(--tile); }
  #address:focus-within { background: var(--active); box-shadow: var(--shadow); }
  #address svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #insecure { color: var(--muted); }
  #url { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: none; color: var(--fg); font: inherit; font-weight: 500; user-select: text; }
  #url::placeholder { color: var(--muted); font-weight: 400; }
  #copy { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--muted); display: grid; place-items: center; }
  #copy:hover { background: var(--hover); color: var(--fg); }
  #copy .ok, #copy.done .link { display: none; }
  #copy.done .ok { display: block; }
  #favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 10px; }
  .tile { height: 40px; font-size: 16px; } /* the rest is favs.css */
  .list .pin { display: grid; color: var(--muted); }
  .list .pin svg { width: 12px; height: 12px; fill: currentColor; }

  .top { display: flex; align-items: center; margin: -4px 0 6px; }
  #github { width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; }
  #github:hover { background: var(--hover); color: var(--fg); }
  #github svg { width: 14px; height: 14px; fill: currentColor; }
  #clock { padding-left: 4px; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  #dock { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted); display: grid; place-items: center; }
  #dock:hover { background: var(--hover); color: var(--fg); }
  #dock svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  html:not(.embed) #dock svg { fill: currentColor; } /* filled pin = docked */
  .new { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-block: 2px solid transparent; border-radius: 8px; background-color: transparent; background-clip: padding-box; color: var(--muted); font: inherit; text-align: left; }
  .new:hover { background-color: var(--hover); }
  /* footer, stuck to the bottom: Clear (trash, asks on the button first) left; New folder and Activity right */
  #foot { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; pointer-events: none; } /* clicks between the buttons reach the tabs */
  #foot button { position: relative; pointer-events: auto; display: flex; align-items: center; gap: 6px; height: 30px; min-width: 30px; padding: 0 7px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 500;
                 transition: background-color .18s ease-out, color .15s ease, scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  #foot button:active { scale: .96; }
  #foot button[hidden] { display: none; }
  #foot button:hover { background: var(--hover); color: var(--fg); }
  #foot svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #clear span:empty { display: none; }
  #clear.confirm, #clear.confirm:hover { color: var(--danger); }
  #newfolder { margin-left: auto; } /* the right group stays right even while Clear is hidden */
  /* tooltip (data-tip) above the button; the native title waits a second and can't be styled. Right-aligned, so it grows leftwards inside the panel */
  [data-tip] { position: relative; }
  [data-tip]::after { content: attr(data-tip); position: absolute; z-index: 2; right: 0; bottom: calc(100% + 6px); padding: 5px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 400; line-height: 1.3; width: max-content; white-space: nowrap; pointer-events: none;
                      opacity: 0; translate: 0 3px; scale: .97; transform-origin: bottom right; transition: opacity 125ms ease-out, translate 125ms ease-out, scale 125ms ease-out; }
  #clear::after { right: auto; left: 0; transform-origin: bottom left; } /* at the left edge: grows rightwards */
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; translate: 0 0; scale: 1; transition-delay: .3s; } /* waits going in, leaves at once */
  .confirm::after { display: none; } /* a confirm ask says it already */
  .tips-warm [data-tip]::after, .tips-warm [data-tip]:hover::after { transition: none; } /* one tooltip already showed: the next one swaps in at once */
  /* a confirm ask (Clear, folder ×) blurs in, so the change of meaning registers */
  #clear.confirm span, .list .x.confirm { animation: ask 180ms cubic-bezier(0.23, 1, 0.32, 1); }
  #clear.confirm span { animation-name: ask-slide; }
  @keyframes ask { from { opacity: 0; filter: blur(2px); } }
  @keyframes ask-slide { from { opacity: 0; filter: blur(2px); translate: -4px 0; } }
  #new { margin-top: 1px; } /* keeps its hover apart from the last tab row above */
  .rename { padding: 2px 4px; margin-left: -4px; border: 0; outline: 0; border-radius: 4px; background: var(--tile); color: var(--fg); font: inherit; user-select: text; }
  .new span { width: 16px; text-align: center; font-size: 16px; line-height: 1; }

  ul { list-style: none; margin: 0; padding: 0; }
  .list li { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 10px; border-block: 2px solid transparent; border-radius: 8px; background-clip: padding-box; } /* the transparent borders keep the hover blob off its neighbours */
  .list li.cursor, #pinned li:not(.active):hover { background-color: var(--hover); } /* mouse and ↑↓ share one highlight */
  .list li.active { background-color: var(--active); box-shadow: var(--shadow); }
  #pinbox { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgb(128 128 128 / .2); } /* Pinned and its folders, above the open tabs */
  #pinned li.closed { color: var(--muted); } /* saved, but no tab open */
  #pinned .folder svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #pinned .drop, #pinned.drop { box-shadow: inset 0 0 0 1.5px rgb(128 128 128 / .45); } /* where a dragged tab will land */
  #pinned.drop { border-radius: 8px; }
  #pinned li.drop { background-color: var(--tile-hover); }
  .list li.dragging.into { scale: .94; opacity: .85; } /* shrinks a little over a folder: going in */
  .list .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list li.marquee .t { text-overflow: clip; }
  .list li.marquee .t > span { display: inline-block; transition: translate linear .2s; } /* distance + duration set on the span by sidebar.js */
  @media (prefers-reduced-motion: reduce) { .list li.marquee .t { text-overflow: ellipsis; } .list li.marquee .t > span { display: inline; } }
  .list .x { width: 22px; height: 22px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 15px; line-height: 1; }
  @media (hover: hover) and (pointer: fine) { /* hover-revealed only where hover exists */
    .list .x { visibility: hidden; }
    .list li:hover .x, .list li:focus-within .x { visibility: visible; } /* hidden also drops them from the tab order: show while tabbing through */
  }
  .list button.t { border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: left; outline: 0; } /* the row is the focus indicator */
  .list li:has(.t:focus-visible) { background-color: var(--hover); box-shadow: inset 0 0 0 1.5px var(--muted); } /* the tint alone is 1.2:1; the ring is 3:1+ */
  .list .pin-btn { display: grid; place-items: center; }
  .list .pin-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #menu, #activity { position: fixed; inset: auto; margin: 0; padding: 4px; border: 1px solid rgb(128 128 128 / .2); border-radius: 10px; background: var(--bg); color: var(--fg); box-shadow: 0 8px 24px rgb(0 0 0 / .16);
                     transition: opacity 150ms ease-out, scale 150ms cubic-bezier(0.23, 1, 0.32, 1); }
  #menu { min-width: 170px; transform-origin: top right; }
  @starting-style { #menu:popover-open, #activity:popover-open { opacity: 0; scale: .96; } } /* opens from the button it came from; closes at once */
  #menu button { display: block; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; }
  #menu button:hover, #menu button:focus-visible { background: var(--hover); outline: 0; }
  /* the button whose popover is open stays lit and shown: the footer's chart icon (no tooltip: hovering it opens the real thing), a row's ⋯ */
  body:has(#activity:popover-open) #activity-btn, .list .x.open { background: var(--hover); color: var(--fg); visibility: visible; }
  #pinned li:has(.x.open) { background-color: var(--hover); }
  /* Activity: what Compass keeps and does, above the footer's chart icon. Muted labels, firm values; a section's one action sits in its header */
  #activity { right: 8px; bottom: 46px; width: min(248px, calc(100% - 16px)); padding: 6px 12px 10px; font-size: 12px; transform-origin: bottom right; outline: 0; } /* narrower floating sidebar: keep the popover inside it */
  #activity .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 2px; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #activity .sec:first-child { margin-top: 4px; }
  #activity .sec button { margin-right: -5px; padding: 1px 5px; border: 0; border-radius: 4px; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  #activity .sec button:hover, #activity .sec button:focus-visible { background: var(--hover); color: var(--fg); outline: 0; }
  #activity .row { display: flex; justify-content: space-between; gap: 12px; line-height: 1.75; color: var(--muted); }
  #activity .row b { color: var(--fg); font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #activity .row b.dim { color: var(--muted); font-weight: 400; } /* "not set", "nothing yet": an absence reads quieter than a value */
  .list .x.away { visibility: visible; } /* back to the pinned page: shown at rest, it's also the sign the tab wandered off */
  .list .x.confirm, .list .x.confirm:hover { width: auto; padding: 0 6px; visibility: visible; color: var(--danger); font-size: 12px; font-weight: 500; }
  .list .x:hover { background: var(--hover); color: var(--fg); }

  /* crisp hover: lights up instantly, fades out slowly; press shrinks a touch */
  .list li, .new, #dock { transition: background-color .18s ease-out, scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.cursor, #pinned li:not(.active):hover, .new:hover, #dock:hover { transition: background-color 0s, scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
  .new:active, #dock:active { scale: .98; }

  /* reorder: neighbours slide aside to preview the drop; the dragged row follows the pointer 1:1 */
  .list.reordering li { transition: translate 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.dragging { z-index: 1; background-color: var(--active); box-shadow: 0 6px 18px rgb(0 0 0 / .14), 0 1px 2px rgb(0 0 0 / .08); scale: 1.02; cursor: grabbing;
                      transition: scale 150ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 150ms cubic-bezier(0.23, 1, 0.32, 1); }
  .list li.settling { z-index: 1; transition: translate 150ms cubic-bezier(0.23, 1, 0.32, 1), scale 150ms cubic-bezier(0.23, 1, 0.32, 1), box-shadow 150ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { /* keep the color fade, drop the press scale */
    .list li, .new, #dock { transition: background-color .18s ease-out; }
    .new:active, #dock:active { scale: 1; }
    .list.reordering li, .list li.settling { transition: none; } /* rows jump to their slots instead of sliding */
    .list li.dragging { scale: 1; transition: none; }
    #foot button:active { scale: 1; }
    [data-tip]::after { translate: 0 0; scale: 1; } /* tooltip just fades */
    #clear.confirm span { animation-name: ask; } /* no slide */
    @starting-style { #menu:popover-open, #activity:popover-open { scale: 1; } } /* fade only */
  }
</style>
</head>
<body>
<div class="top">
  <button id="github" title="Compass on GitHub"><svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></button>
  <span id="clock"></span>
  <button id="dock"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
</div>
<div id="address">
  <svg id="insecure" viewBox="0 0 24 24"><title>Not secure: plain http</title><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  <input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address">
  <button id="copy" title="Copy URL">
    <svg class="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
    <svg class="ok" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>
  </button>
</div>
<div id="favs"></div>
<div id="pinbox">
  <ul id="pinned" class="list"></ul>
</div>
<ul id="tabs" class="list" aria-label="Open tabs"></ul>
<button id="new" class="new"><span aria-hidden="true">+</span>New tab</button>
<div id="foot">
  <button id="clear" aria-label="Close other tabs" data-tip="Close other tabs">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg><span></span>
  </button>
  <button id="newfolder" aria-label="New folder" data-tip="New folder">
    <svg viewBox="0 0 24 24"><path d="M12 10v6m-3-3h6M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
  </button>
  <button id="activity-btn" aria-label="Activity">
    <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
  </button>
</div>
<div id="menu" popover role="menu"></div>
<div id="activity" popover role="dialog" aria-label="Activity" tabindex="-1"></div>
<script type="module" src="sidebar.js"></script>
</body>
</html>
