<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="favs.css">
<style>
  :root { --bg: #fff; --fg: #1c1c1e; --muted: #6e6e73; --sel: rgb(0 0 0 / .06); --line: rgb(0 0 0 / .08); --tile: rgb(0 0 0 / .05); --tile-hover: rgb(0 0 0 / .1); --glass: rgb(255 255 255 / .62); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #98989d; --sel: rgb(255 255 255 / .09); --line: rgb(255 255 255 / .1); --tile: rgb(255 255 255 / .07); --tile-hover: rgb(255 255 255 / .13); --glass: rgb(28 28 30 / .92); } } /* .92: muted text keeps 4.5:1 even over a white page */
  * { box-sizing: border-box; }
  :root { color-scheme: light dark; } /* same as the overlay's iframe: a mismatch makes Chrome paint the frame opaque white */
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  .embed { background: var(--glass); } /* glass tint lives in the frame, not the overlay: frame and page can disagree on dark mode, and the tint must match the text */
  .embed body { background: transparent; }
  .bar { width: 640px; max-width: 100%; margin: 0 auto; }
  #favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 12px 12px 0; }
  .tile { height: 44px; font-size: 18px; } /* the rest is favs.css */
  .tile img { width: 20px; height: 20px; }
  .field { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  #pill { display: flex; align-items: center; gap: 6px; flex: none; margin-left: 14px; padding: 4px 10px 4px 7px; border-radius: 8px; background: var(--tile-hover); font-size: 14px; font-weight: 500; }
  #pill[hidden] { display: none; }
  #pill img { width: 16px; height: 16px; }
  input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 16px 18px; font-size: 18px; background: transparent; color: inherit; }
  #pill:not([hidden]) + input { padding-left: 10px; }
  ul { list-style: none; margin: 0; padding: 6px; max-height: 440px; overflow-y: auto; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: default; }
  li.sel { background: var(--sel); }
  li img { width: 16px; height: 16px; flex: none; }
  li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .k { color: var(--muted); font-size: 12px; flex: none; }
</style>
</head>
<body>
<div class="bar">
  <div id="favs"></div>
  <div class="field">
    <span id="pill" hidden><img alt=""><span></span></span>
    <input placeholder="Search tabs, bookmarks, history or the web" aria-label="Search" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="results" autofocus spellcheck="false">
  </div>
  <ul id="results" role="listbox"></ul>
</div>
<script type="module" src="bar.js"></script>
</body>
</html>
