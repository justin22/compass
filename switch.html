<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch tab</title>
<script src="theme.js"></script>
<style>
  :root { color-scheme: light dark; /* same as the overlay's iframe: a mismatch makes Chrome paint the frame opaque white */ --fg: #1c1c1e; --tile: rgb(0 0 0 / .05); --sel: #fff; --shadow: 0 1px 2px rgb(0 0 0 / .1); --glass: rgb(255 255 255 / .62); }
  :root[data-theme="dark"] { --fg: #f2f2f7; --tile: rgb(255 255 255 / .06); --sel: rgb(255 255 255 / .1); --shadow: none; --glass: rgb(28 28 30 / .92); } /* .92: the glass stays readable over a white page */
  * { box-sizing: border-box; }
  html { background: var(--glass); } /* glass tint lives in the frame, not the overlay: frame and page can disagree on dark mode, and the tint must match the text */
  body { margin: 0; color: var(--fg); font: 13px/1.3 system-ui, sans-serif; user-select: none; }
  #strip { display: grid; gap: 10px; width: fit-content; max-width: 100%; max-height: 100vh; padding: 14px; overflow-y: auto; scrollbar-width: none; outline: 0; } /* columns set by switch.js to fit the window */
  .tab { width: 200px; padding: 6px; border-radius: 14px; }
  .tab.sel { background: var(--sel); box-shadow: var(--shadow); } /* same active row as the sidebar: a lifted surface, no coloured ring */
  .shot { display: grid; place-items: center; height: 124px; border-radius: 9px; background: var(--tile); overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .shot img.fav { width: 28px; height: 28px; } /* no preview yet: favicon on grey */
  .cap { display: flex; align-items: center; gap: 7px; padding: 8px 4px 2px; }
  .cap img { width: 16px; height: 16px; flex: none; }
  .cap span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="strip" role="listbox" aria-label="Open tabs" tabindex="-1"></div>
<script type="module" src="switch.js"></script>
</body>
</html>
