<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass options</title>
<script src="theme.js"></script>
<style>
  :root { color-scheme: light; --bg: #ececef; --fg: #1c1c1e; --muted: #626267; /* 4.6:1 on --tile */ --tile: rgb(0 0 0 / .05); --line: rgb(0 0 0 / .1); }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1e1e20; --fg: #f2f2f7; --muted: #98989d; --tile: rgb(255 255 255 / .06); --line: rgb(255 255 255 / .14); }
  * { box-sizing: border-box; }
  body { position: relative; width: 360px; margin: 0; padding: 14px 16px 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  h1:not(:first-child) { margin-top: 14px; }
  label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--tile); margin-bottom: 6px; cursor: pointer; }
  label.theme { align-items: center; }
  label.theme span { flex: 1; }
  input { margin: 3px 0 0; flex: none; accent-color: #0a84ff; }
  select { flex: none; padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit; }
  b { display: block; font-weight: 500; }
  small { color: var(--muted); }
  p { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  a { color: inherit; }
  .gh { position: absolute; top: 10px; right: 12px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
  .gh:hover, .gh:focus-visible { background: var(--tile); color: var(--fg); }
  .gh svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
<h1>Appearance</h1>
<label class="theme"><span><b>Theme</b><small>Auto follows your system's light or dark setting. Pick Light or Dark when your browser theme is different.</small></span><select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<h1>What Compass does on its own</h1>
<label><input type="checkbox" id="swapNewTab"><span><b>Cmd+T opens the command bar</b><small>Off: Cmd+T opens the browser's new tab page as usual.</small></span></label>
<label><input type="checkbox" id="shiftPeek"><span><b>Shift+click a link to peek it</b><small>Off: Shift+click opens a new window as usual. Right-click → Peek still works.</small></span></label>
<label><input type="checkbox" id="edgeHover"><span><b>Left edge opens the sidebar</b><small>Off: only the shortcut opens it.</small></span></label>
<label><input type="checkbox" id="autoArchive"><span><b>Close tabs untouched for 12 hours</b><small>They are saved first, so the command bar can still find them. Off: tabs stay open until you close them.</small></span></label>
<h1>Privacy</h1>
<label><input type="checkbox" id="previews"><span><b>Keep a picture of each tab</b><small>For the tab switcher. Pictures stay in memory and go when the browser closes. Off: favicons instead, and any pictures taken are dropped.</small></span></label>
<p>Keyboard shortcuts are set at <a href="chrome://extensions/shortcuts" id="keys">chrome://extensions/shortcuts</a>.</p>
